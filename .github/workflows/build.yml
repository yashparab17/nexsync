name: Build App
on: [push, workflow_dispatch]

jobs:
    build:
        # Skip on ordinary pushes — only runs when manually triggered, or when the commit
        # message contains "[build]" (e.g. `git commit -m "fix: whatever [build]"`).
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]')
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: ubuntu-22.04
                      args: ""
                    - platform: windows-latest
                      args: ""
                    - platform: macos-latest
                      args: "--target universal-apple-darwin"

        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/checkout@v4

            - name: Install system dependencies (Linux)
              if: matrix.platform == 'ubuntu-22.04'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "pnpm"

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

            - name: Install dependencies
              run: pnpm install

            - name: Build Tauri App
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  args: ${{ matrix.args }}

            - name: Upload bundles
              uses: actions/upload-artifact@v4
              with:
                  name: nexsync-${{ matrix.platform }}
                  path: |
                      src-tauri/target/release/bundle/appimage/*.AppImage
                      src-tauri/target/release/bundle/deb/*.deb
                      src-tauri/target/release/nexsync
                      src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
                      src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
                      src-tauri/target/release/bundle/msi/*.msi
                      src-tauri/target/release/bundle/nsis/*.exe
                  if-no-files-found: ignore
