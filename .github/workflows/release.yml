name: Release App
# Cuts a signed, cross-platform GitHub Release with updater artifacts. Only runs on a
# version tag (git tag v0.2.0 && git push --tags) or a manual dispatch — never on an
# ordinary push, since (unlike build.yml) it publishes a real release.
on:
    push:
        tags: ["v*"]
    workflow_dispatch:

jobs:
    release:
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: ubuntu-22.04
                      args: ""
                    - platform: windows-latest
                      args: ""
                    - platform: macos-latest
                      args: "--target universal-apple-darwin"

        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/checkout@v4

            - name: Install system dependencies (Linux)
              if: matrix.platform == 'ubuntu-22.04'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "pnpm"

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

            - name: Install dependencies
              run: pnpm install

            # Tauri does not read the certificate secrets itself: the certificate goes into the Windows store and the
            # bundler is told which one to sign with. Skipped when no certificate secret is set.
            - name: Import Windows code-signing certificate
              if: matrix.platform == 'windows-latest' && env.WINDOWS_CERTIFICATE != ''
              shell: pwsh
              env:
                  WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
                  WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
              run: |
                  New-Item -ItemType directory -Path certificate
                  Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
                  certutil -decode certificate/tempCert.txt certificate/certificate.pfx
                  $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
                  $cert = Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
                  $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
                  $windows = [pscustomobject]@{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com' }
                  $conf.bundle | Add-Member -NotePropertyName windows -NotePropertyValue $windows -Force
                  $conf | ConvertTo-Json -Depth 20 | Set-Content src-tauri/tauri.conf.json

            - name: Build and publish release
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # Signs the updater artifacts so the app's updater (tauri.conf.json's
                  # plugins.updater.pubkey) will trust them. Required for the updater to work.
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
                  # Windows Authenticode code signing — optional, no-ops if unset (see PROJECT plan)
                  WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
                  WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
                  # macOS code signing + notarization — optional, no-ops if unset
                  APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
                  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
                  APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
              with:
                  args: ${{ matrix.args }}
                  tagName: v__VERSION__
                  releaseName: "Nexsync v__VERSION__"
                  releaseDraft: true
                  # A tag with a dash, such as v0.7.0-beta.1, is a pre-release: stable users are not offered it
                  prerelease: ${{ contains(github.ref_name, '-') }}
                  # Shown in the app as "What's new" when this release is installed as an update; edit before publishing
                  releaseBody: "Edit these release notes before publishing the draft. They appear in the app under Settings > Updates."
                  includeUpdaterJson: true
