name: Release App
# Cuts a signed, cross-platform GitHub Release with updater artifacts. Only runs on a
# version tag (git tag v0.2.0 && git push --tags) or a manual dispatch — never on an
# ordinary push, since (unlike build.yml) it publishes a real release.
on:
    push:
        tags: ["v*"]
    workflow_dispatch:

jobs:
    release:
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: ubuntu-22.04
                      args: ""
                    - platform: windows-latest
                      args: ""
                    - platform: macos-latest
                      args: "--target universal-apple-darwin"

        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/checkout@v4

            - name: Install system dependencies (Linux)
              if: matrix.platform == 'ubuntu-22.04'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 12.11.2

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "pnpm"

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

            - name: Install dependencies
              run: pnpm install

            # Tauri does not read the certificate secrets itself: the certificate goes into the Windows store and the
            # bundler is told which one to sign with. Skipped when no certificate secret is set.
            - name: Import Windows code-signing certificate
              if: matrix.platform == 'windows-latest' && env.WINDOWS_CERTIFICATE != ''
              shell: pwsh
              env:
                  WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
                  WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
              run: |
                  New-Item -ItemType directory -Path certificate
                  Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
                  certutil -decode certificate/tempCert.txt certificate/certificate.pfx
                  $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
                  $cert = Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
                  $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
                  $windows = [pscustomobject]@{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com' }
                  $conf.bundle | Add-Member -NotePropertyName windows -NotePropertyValue $windows -Force
                  $conf | ConvertTo-Json -Depth 20 | Set-Content src-tauri/tauri.conf.json

            # The notes come from the repository, so the update file the app reads holds them (editing the draft afterwards does not change it)
            - name: Read the release notes
              id: notes
              shell: bash
              run: |
                  if [ -s RELEASE_NOTES.md ]; then body="$(cat RELEASE_NOTES.md)"; else body="Bug fixes and improvements."; fi
                  { echo "body<<NOTES_END"; echo "$body"; echo "NOTES_END"; } >> "$GITHUB_OUTPUT"

            - name: Build and publish release
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # Signs the updater artifacts so the app's updater (tauri.conf.json's
                  # plugins.updater.pubkey) will trust them. Required for the updater to work.
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
                  # Windows Authenticode code signing — optional, no-ops if unset (see PROJECT plan)
                  WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
                  WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
                  # macOS code signing + notarization — optional, no-ops if unset
                  APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
                  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
                  APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
              with:
                  args: ${{ matrix.args }}
                  tagName: v__VERSION__
                  releaseName: "Nexsync v__VERSION__"
                  releaseDraft: true
                  # A tag with a dash, such as v0.7.0-beta.1, is a pre-release: stable users are not offered it
                  prerelease: ${{ contains(github.ref_name, '-') }}
                  # Shown in the app as "What's new" when this release is installed as an update (RELEASE_NOTES.md at the tag)
                  releaseBody: ${{ steps.notes.outputs.body }}
                  includeUpdaterJson: true

    # The AppImage ships its own Wayland, EGL, GL and GBM libraries, which clash with a newer system's graphics drivers
    # (Arch: "Could not create default EGL display: EGL_BAD_PARAMETER"). This strips them so the system's are used, then
    # repacks, re-signs (the updater checks the signature) and replaces the AppImage, its .sig and the update file's entry.
    linux-appimage-libs:
        needs: release
        runs-on: ubuntu-22.04
        permissions:
            contents: write
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 12.11.2
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "pnpm"
            - run: pnpm install
            - name: Strip the bundled graphics libraries
              run: |
                  sudo apt-get update && sudo apt-get install -y libfuse2 squashfs-tools
                  tag="v$(node -p "require('./package.json').version")"
                  mkdir work && cd work
                  gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.AppImage'
                  app="$(ls *.AppImage)"
                  chmod +x "$app" && "./$app" --appimage-extract >/dev/null
                  find squashfs-root -name 'libwayland-*' -o -name 'libEGL*' -o -name 'libGL.*' -o -name 'libGL-*' -o -name 'libGLX*' -o -name 'libgbm*' | xargs -r rm -fv
                  curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
                  chmod +x appimagetool
                  rm "$app"
                  ARCH=x86_64 ./appimagetool --appimage-extract-and-run squashfs-root "$app"
                  rm -f "$app.sig"
                  pnpm --dir .. tauri signer sign "$PWD/$app"
                  gh release upload "$tag" "$app" "$app.sig" --repo "$GITHUB_REPOSITORY" --clobber
                  gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern latest.json
                  sig="$(cat "$app.sig")"
                  node -e "
                    const fs=require('fs');const j=JSON.parse(fs.readFileSync('latest.json','utf8'));
                    for(const k of Object.keys(j.platforms)) if(k.startsWith('linux-x86_64')) j.platforms[k].signature=process.argv[1];
                    fs.writeFileSync('latest.json',JSON.stringify(j,null,2));" "$sig"
                  gh release upload "$tag" latest.json --repo "$GITHUB_REPOSITORY" --clobber
