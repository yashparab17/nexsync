[package]
name = "nexsync"
version = "0.9.1"
description = "Local-first peer-to-peer workspace for notes, tasks and code"
authors = ["Yash Parab", "Dhruv Dinda"]
license = "MIT"
edition = "2021"
# The window app is the one `cargo run` and `tauri dev` start; `nexsync-cli` is the command-line tool beside it
default-run = "nexsync"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nexsync_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
strum = { version = "0.26", features = ["derive"] }
rand = "0.8"
base64 = "0.22"
iroh = "1.2"
url = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "fs", "io-util", "process"] }
data-encoding = "2"
subtle = "2"
postcard = { version = "1", default-features = false, features = ["use-std"] }
notify = "8"
blake3 = "1"
aes-gcm = "0.10"
curve25519-dalek = "5"
sha2 = "0.10"
trash = "5"
zip = { version = "2", default-features = false, features = ["deflate"] }
portable-pty = "0.9"
ignore = "0.4.33"
regex = "1.13.1"
# Office file formats (Phase 21): the format crates of WordCraft, by commit. MIT OR Apache-2.0; see THIRD_PARTY_NOTICES.md.
wordcraft-doc = { git = "https://github.com/yashparab17/wordcraft", rev = "0b87487778b27ff42454bb48cd9aef61c5176382" }
wordcraft-docx = { git = "https://github.com/yashparab17/wordcraft", rev = "0b87487778b27ff42454bb48cd9aef61c5176382" }
wordcraft-formats = { git = "https://github.com/yashparab17/wordcraft", rev = "0b87487778b27ff42454bb48cd9aef61c5176382" }
wordcraft-docbin = { git = "https://github.com/yashparab17/wordcraft", rev = "0b87487778b27ff42454bb48cd9aef61c5176382" }
wordcraft-pdf = { git = "https://github.com/yashparab17/wordcraft", rev = "0b87487778b27ff42454bb48cd9aef61c5176382" }
wordcraft-proof = { git = "https://github.com/yashparab17/wordcraft", rev = "0b87487778b27ff42454bb48cd9aef61c5176382" }
wordcraft-layout = { git = "https://github.com/yashparab17/wordcraft", rev = "0b87487778b27ff42454bb48cd9aef61c5176382" }
wordcraft-render = { git = "https://github.com/yashparab17/wordcraft", rev = "0b87487778b27ff42454bb48cd9aef61c5176382" }
wordcraft-fonts = { git = "https://github.com/yashparab17/wordcraft", rev = "0b87487778b27ff42454bb48cd9aef61c5176382" }
# Spreadsheet engine and .xlsx files (Phase 21): GridCraft, by commit. MIT OR Apache-2.0; see THIRD_PARTY_NOTICES.md.
gridcraft-engine = { git = "https://github.com/storytold/gridcraft", rev = "f1894c6da64d4326022ae644c767581816a23c2c" }
gridcraft-xlsx = { git = "https://github.com/storytold/gridcraft", rev = "f1894c6da64d4326022ae644c767581816a23c2c" }
gridcraft-chart = { git = "https://github.com/storytold/gridcraft", rev = "f1894c6da64d4326022ae644c767581816a23c2c" }
# Slide decks (Phase 21): DeckCraft, by commit. MIT OR Apache-2.0; see THIRD_PARTY_NOTICES.md.
deckcraft-model = { git = "https://github.com/storytold/deckcraft", rev = "1dc69720db64323370dda061226becb09ad79fd4" }
deckcraft-geom = { git = "https://github.com/storytold/deckcraft", rev = "1dc69720db64323370dda061226becb09ad79fd4" }
deckcraft-color = { git = "https://github.com/storytold/deckcraft", rev = "1dc69720db64323370dda061226becb09ad79fd4" }
deckcraft-pptx = { git = "https://github.com/storytold/deckcraft", rev = "1dc69720db64323370dda061226becb09ad79fd4" }
deckcraft-render = { git = "https://github.com/storytold/deckcraft", rev = "1dc69720db64323370dda061226becb09ad79fd4" }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# The device key goes in the OS credential store on these systems
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native", "apple-native"] }

# Required by craft-pdf (used by wordcraft-pdf): the PDF backend must be the patched one, which rejects writers that failed while unwinding.
[patch.crates-io]
krilla = { git = "https://github.com/storytold/craft-libs", rev = "b926b5c03e256c86ca10934f58d03f628810b5b7" }

# Every dependency is optimised in debug builds too (built once, then cached): unoptimised, the office engines, the picture decoders
# behind slides (a photo slide took 1.6 s to draw), signature checks and pattern matching make `tauri dev` far slower than a release.
# Only this crate stays unoptimised, so it rebuilds quickly.
[profile.dev.package."*"]
opt-level = 3

# Not panic = "abort": the office engines guard their parsers with catch_unwind, which needs unwinding.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
